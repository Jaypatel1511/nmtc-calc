name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev extras
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest tests/ -v

  mutation:
    # Mutation-testing gate (tools/mutation_gate.py). Runs the full campaign
    # against tools/mutation_baseline.json; the floor is derived from the
    # baseline's per-mutant records, never typed. Python pinned to the version
    # the baseline was generated with.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"

    - name: Install package with dev extras
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Mutation gate
      run: python tools/mutation_gate.py --workers 2

  # Runs release.yml's EXACT wheel-test invocation on every PR, so a broken
  # release pipeline is found before tag time rather than at it. The test
  # command below must stay byte-identical to release.yml's test-wheel step;
  # tests/test_workflows.py asserts that. pytest is invoked through the venv's
  # `pytest` entrypoint, NOT `python -m pytest`: `-m` puts the cwd (the
  # checkout, with ./nmtccalc in it) on sys.path and tests the source tree.
  release-invocation:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Install wheel into fresh venv (no source editable install)
      run: |
        python -m venv /tmp/wheel_test_venv
        /tmp/wheel_test_venv/bin/pip install --upgrade pip
        /tmp/wheel_test_venv/bin/pip install dist/*.whl "pytest>=7"

    - name: Assert the installed wheel is what gets imported
      run: |
        cd "$(mktemp -d)"
        ORIGIN=$(/tmp/wheel_test_venv/bin/python -c "import nmtccalc; print(nmtccalc.__file__)")
        echo "import resolved to: ${ORIGIN}"
        case "${ORIGIN}" in
          *"/site-packages/"*) ;;
          *) echo "::error::nmtccalc resolved to ${ORIGIN}, not the installed wheel"; exit 1 ;;
        esac

    - name: Run test suite against installed wheel
      run: |
        /tmp/wheel_test_venv/bin/pytest tests/ \
          -v --tb=short \
          --no-header \
          --import-mode=importlib

  # The sdist must ship its own suite and pass it (0.2.1's did not: 52 of 53
  # tests errored for want of conftest.py). tools/check_sdist.py builds from
  # `git archive HEAD`, installs the tarball and runs the suite inside it.
  sdist:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"

    - name: Check the sdist
      run: |
        python -m pip install --upgrade pip build
        python tools/check_sdist.py

  # README gate (tools/docs_check.py, copied verbatim from nmtc-mapper). It
  # checks the README against a built wheel, from a directory with no
  # ./nmtccalc in it.
  docs-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python 3.12
      # 3.12 for tomllib, which docs_check.py uses to read docs-check.toml.
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Build the wheel
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Run docs-check against the built wheel
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "${RUNNER_TEMP}/docs-venv"
        VPY="${RUNNER_TEMP}/docs-venv/bin/python"
        "${VPY}" -m pip install --upgrade pip
        "${VPY}" -m pip install "$(ls dist/*.whl)" pytest
        DOCSDIR="${RUNNER_TEMP}/docs-check"
        mkdir -p "${DOCSDIR}/docs"
        cp -R tests "${DOCSDIR}/tests"
        cp -R tools "${DOCSDIR}/tools"
        cp -R docs/README.expected "${DOCSDIR}/docs/README.expected"
        cp README.md pyproject.toml docs-check.toml docs-check-denylist.txt "${DOCSDIR}/"
        cd "${DOCSDIR}"
        "${VPY}" tools/docs_check.py --root .
