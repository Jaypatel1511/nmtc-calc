[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtc-calc"
version = "0.2.1"
description = "Python calculator for New Markets Tax Credit (NMTC) leveraged transactions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter", "ipykernel"]

[project.urls]
Homepage = "https://jaypatel1511.github.io/cdfi-superpowers/"
Repository = "https://github.com/Jaypatel1511/nmtc-calc"
Documentation = "https://github.com/Jaypatel1511/nmtc-calc#readme"
Issues = "https://github.com/Jaypatel1511/nmtc-calc/issues"
Changelog = "https://github.com/Jaypatel1511/nmtc-calc/blob/main/CHANGELOG.md"
